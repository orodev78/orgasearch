sources:
  ror:
    enabled: true
    timeout_seconds: 5
    default_per_source: 10
    requires_env: []
  wikidata:
    enabled: true
    timeout_seconds: 6
    default_per_source: 10
    requires_env: []
  hal:
    enabled: true
    timeout_seconds: 5
    default_per_source: 10
    requires_env: []
  openalex:
    enabled: true
    timeout_seconds: 5
    default_per_source: 10
    requires_env: [OPENALEX_API_KEY]
  labrri-tours:
    enabled: true
    adapter: labri
    display_name: "LaBRRI Tours"
    timeout_seconds: 5
    default_per_source: 10
    base_url_env: LABRI_TOURS_API_URL
    api_key_env: LABRI_TOURS_API_KEY
